  <!-- Pixel Ekstraksi Kanan -->
  <rect x="46" y="28" width="14" height="14" rx="3" fill="#2563EB" />
  
  <!-- Pixel Sudut Kanan Bawah -->
  <rect x="46" y="46" width="14" height="14" rx="3" fill="currentColor" />
</svg>