<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="40" height="40" fill="none" class="pixel-logo">
  <!-- Blok Utama (Mempresentasikan "Store" atau "Vault") -->
  <rect x="10" y="28" width="32" height="32" rx="6" fill="currentColor" />
  
  <!-- Pixel Ekstraksi Atas (Mempresentasikan data API/Digital) -->
